[build-system]
requires = ["uv_build>=0.9.5,<1.0.0"]
build-backend = "uv_build"

[project]
name = "cellpax"
version = "0.0.1"
description = "Cell feature universe analysis for connectomics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crepes>=0.9",
    "datafolio",
    "diptest>=0.8",
    "igraph>=1.0.0",
    "joblib>=1.5",
    "leidenalg>=0.11.0",
    "numpy>=1.26",
    "polars>=1.0.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
]
authors = [
    { name = "Casey Schneider-Mizell", email = "caseysm@gmail.com" },
]

classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
# Embedding backends are optional: each is only needed by ft.embed(method=...), and
# pacmap in particular pulls faiss-cpu and numba, which constrain the numpy version.
umap = [
    "umap-learn>=0.5",
]
pacmap = [
    "pacmap>=0.8",
]
embeddings = [
    "umap-learn>=0.5",
    "pacmap>=0.8",
]
# The AnnData bridge (ft.to_anndata / from_anndata): one adapter instead of
# re-implementing what scanpy/scvi already do.
anndata = [
    "anndata>=0.10",
]
# Gibbs–Cherian–Candès conditional conformal prediction (the shift-aware
# coverage candidate). cvxpy is what MAPIE actually needs for this path —
# its own 'conditional' extra also pins torch, which this route avoids.
conditional = [
    "mapie>=1.5",
    "cvxpy>=1.7",
]
# The local labeling app (cellpax.app). Nothing in cellpax imports these — the
# library stays headless and frame-emitting; the app is a separate layer that
# consumes those frames, and it is where the decision ledger lives (an explicit
# non-goal of the library, DESIGN_PROPOSAL.md).
app = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
# Density-valley significance, information imbalance, and intrinsic dimension.
# Pinned to a commit: the 0.3.4 PyPI wheel still declares numpy<2.0 and an
# exact jax pin, while the repo has since unpinned both — switch to
# "dadapy>=0.3.5" once a fixed release exists.
dadapy = [
    "dadapy @ git+https://github.com/sissa-data-science/DADApy@c37e52ca3cbe00107696720e5e3efa09f8370bbb",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "pytest-cov",
    "bump-my-version",
    # so the bridge tests exercise real AnnData rather than skipping in CI
    "anndata>=0.10",
]
lint = [
    "ruff",
]
profile = [
    "scalene",
    "pyinstrument",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.uv]
default-groups = [
    "dev",
    "lint",
    "profile",
    "docs",
]

[tool.uv.sources]
datafolio = { path = "../datafolio", editable = true }

[tool.bumpversion]
current_version = "0.0.1"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
regex = false
ignore_missing_version = false
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "v{new_version}"
commit_args = ""
pre_commit_hooks = ['uv sync', 'git add uv.lock']
post_commit_hooks = ["./.bmv-post-commit.sh"]

[[tool.bumpversion.files]]
filename = "src/cellpax/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

# Ruff configuration - minimal rules to start
# See https://docs.astral.sh/ruff/rules/ for available rules
# Common additions: select = ["E", "F", "I"] for errors, pyflakes, and isort
[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select=["E9","F63","F7","F82"]  # Minimal: syntax errors and undefined names

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.poe.tasks.drybump]
cmd = "uv run bump-my-version bump --dry-run --verbose"
help = "Dry run of version bump for the project. Use with 'patch', 'minor', or 'major' to specify the version change."

[tool.poe.tasks.bump]
cmd = "uv run bump-my-version bump"
help = "Bump the version number in the project. Use with 'patch', 'minor', or 'major' to specify the version change."

[tool.poe.tasks.test]
cmd = "uv run pytest --cov=cellpax --cov=cellpax_loky_compat --cov-branch tests"
help = "Run pytest with code coverage."

[tool.poe.tasks.doc-preview]
cmd = "uv run mkdocs serve --dev-addr 127.0.0.1:$port"
help = "Preview documentation locally, optionally on a different port"
    [[tool.poe.tasks.doc-preview.args]]
    name = "port"
    default = "8000"
    help = "Local port for the documentation server"
    options = ["-p", "--port"]

[tool.poe.tasks.app]
cmd = "uv run --extra app python -m cellpax.app $config"
help = "Launch the local labeling app. Pass a config TOML, or omit for the demo fixture."
    [[tool.poe.tasks.app.args]]
    name = "config"
    default = ""
    help = "Path to an app config TOML (see cellpax/app/config.py)"
    positional = true

[tool.poe.tasks.profile-all]
cmd = "uv run scalene"
help = "Profile cpu and memory of task with scalene"

[tool.poe.tasks.profile]
cmd = "uv run pyinstrument -r html"
help = "Profile cpu of task with pyinstrument"
[tool.poe.tasks.lab]
cmd = "uv run --with jupyterlab --with jupyterlab-vim --with jupyterlab-code-formatter --with jupyter-resource-usage --with jupyterlab-execute-time --with catppuccin-jupyterlab --with ipywidgets jupyter lab --no-browser"
help = "Start Jupyter Lab"

[tool.poe.tasks.scratch-lab]
cwd = "scratch"
cmd = "uv run --with jupyterlab --with jupyterlab-vim --with jupyterlab-code-formatter --with jupyter-resource-usage --with jupyterlab-execute-time --with catppuccin-jupyterlab --with ipywidgets jupyter lab --no-browser"
help = "Start Jupyter Lab"

# `cellpax_loky_compat` ships alongside the package rather than inside it: the
# loky resource-tracker server imports it, and importing `cellpax` in that
# process would pull numpy/scipy/sklearn into a daemon that should stay tiny.
[tool.uv.build-backend]
module-name = ["cellpax", "cellpax_loky_compat"]
